name: Publish

on:
  push:
    tags:
      # npm/pnpm version tags, default prefix "v", e.g. v1.0.4
      - 'v*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # setup-node's registry-url writes an empty _authToken into .npmrc, which
      # stops npm from using GitHub OIDC. Trusted publishing needs that exchange.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            echo "Use pnpm version patch|minor|major so the git tag is v plus the package version."
            exit 1
          fi
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm publish --access public --no-git-checks --provenance
